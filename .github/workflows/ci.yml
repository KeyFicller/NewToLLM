name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Read LibTorch version pin
        id: libtorch
        run: echo "version=$(tr -d '[:space:]' < tools/libtorch.version)" >> "$GITHUB_OUTPUT"

      - name: Cache LibTorch
        id: libtorch-cache
        uses: actions/cache@v4
        with:
          path: vendor/libtorch
          key: libtorch-cpu-${{ steps.libtorch.outputs.version }}

      - name: Download LibTorch (CPU)
        if: steps.libtorch-cache.outputs.cache-hit != 'true'
        run: tools/fetch_libtorch.sh

      - name: Build C++ side
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build -j"$(nproc)"

      - name: Install C++ linters (LLVM 19)
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-format-19 clang-tidy-19

      - name: Lint (ruff, mypy --strict, twins, clang-format, clang-tidy)
        env:
          CLANG_FORMAT: clang-format-19
          CLANG_TIDY: clang-tidy-19
          RUN_CLANG_TIDY: run-clang-tidy-19
        run: tools/lint.sh build

      - name: CTest (C++)
        run: ctest --test-dir build --output-on-failure

      - name: pytest (lesson transcripts, parity, training curves)
        run: python -m pytest -v tests

      - name: Build comparison site
        run: python tools/build_site.py

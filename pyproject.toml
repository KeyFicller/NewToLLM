[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newtollm"
version = "2.0.0"
description = "A GPT built twice - PyTorch and LibTorch side by side"
requires-python = ">=3.10"
dependencies = ["torch", "tiktoken"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pygments"]

[tool.setuptools.packages.find]
where = ["py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["py", "tools"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["py", "tools", "tests"]
extend-exclude = ["python_impl", "extras", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "ANN", "PT", "RET", "PL"]
# PLR0913/PLR0917: signatures deliberately mirror the positional C++ twins.
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["py/newtollm", "tools/compare_outputs.py", "tools/check_twins.py", "tools/parity.py", "tools/train_parity.py", "tools/bench.py"]
exclude = ["python_impl", "extras"]
ignore_missing_imports = true
# torch ships a few unannotated methods (e.g. Tensor.backward).
untyped_calls_exclude = ["torch"]
